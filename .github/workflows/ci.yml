name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

concurrency:
    group: build-and-test-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PRIMARY_NODE_VERSION: 24

jobs:
    build-and-test:
        if: github.head_ref != 'main'
        name: Build, Lint, Audit & Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        environment: testing

        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24, 26]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              if: matrix.node-version != env.PRIMARY_NODE_VERSION
              run: npm run build

            - name: Build (with bundle analysis)
              if: matrix.node-version == env.PRIMARY_NODE_VERSION
              run: npm run build
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

            - name: Lint
              if: matrix.node-version == env.PRIMARY_NODE_VERSION
              run: npm run lint

            - name: Format check
              if: matrix.node-version == env.PRIMARY_NODE_VERSION
              run: npm run format:check

            - name: Security audit
              if: matrix.node-version == env.PRIMARY_NODE_VERSION
              run: npm audit --audit-level=high

            - name: Run tests with coverage
              run: npx vitest run --coverage --reporter=junit --reporter=default --outputFile=test-report.junit.xml

            - name: Upload test results to Codecov
              if: ${{ !cancelled() && matrix.node-version == env.PRIMARY_NODE_VERSION }}
              uses: codecov/test-results-action@v1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Upload coverage reports to Codecov
              if: ${{ !cancelled() && matrix.node-version == env.PRIMARY_NODE_VERSION }}
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
